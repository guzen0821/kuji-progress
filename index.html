<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#080808">

<title>くじ進行</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}

button,input{font:inherit}

button{cursor:pointer}

header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #333}

.menu{background:#181818;color:white;border:1px solid #555;border-radius:8px;padding:8px 13px;font-size:20px}

.brand{font-size:15px;font-weight:bold;letter-spacing:1px}

main{max-width:1000px;margin:auto;padding:14px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stat{background:#151515;border:1px solid #383838;border-radius:12px;padding:17px 8px;text-align:center}

.stat small{display:block;color:#aaa;font-size:12px;margin-bottom:9px}

.stat strong{font-size:clamp(30px,7vw,46px)}

.gold{color:#e9c65a}

.prob{margin-top:10px;padding:13px;background:#151515;border:1px solid #383838;border-radius:12px;text-align:center}

.prob small{color:#bbb;font-size:12px}

.prob strong{display:block;color:#e9c65a;font-size:30px;margin-top:4px}

.content{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.panel{background:#121212;border:1px solid #333;border-radius:12px;padding:14px;min-width:0}

.panel h2{font-size:14px;color:#bbb;margin:0 0 13px;font-weight:500}

.result-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.result-buttons button{height:85px;border-radius:12px;font-size:clamp(17px,3vw,24px);font-weight:bold}

.win{background:#e5c052;color:#15110a;border:0}

.lose{background:#252525;color:white;border:1px solid #666}

.hint{color:#888;font-size:11px;text-align:center;margin:10px 0 0}

.history-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #292929;font-size:12px}

.history-row:last-child{border-bottom:0}

.badge{font-size:11px;padding:4px 8px;border-radius:5px;white-space:nowrap}

.badge-win{color:#f1d36a;background:#3a3014}

.badge-lose{color:#ccc;background:#292929}

.empty{color:#777;font-size:13px;padding:12px 0}

#menuBox{display:none;position:absolute;top:53px;left:12px;z-index:5;background:#222;border:1px solid #555;border-radius:10px;padding:7px;min-width:200px;box-shadow:0 8px 25px #000}

#menuBox button{display:block;width:100%;text-align:left;color:white;background:none;border:0;padding:13px;border-radius:6px}

#menuBox button:active{background:#444}

.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:18px}

.dialog{width:100%;max-width:420px;max-height:85vh;overflow:auto;background:#191919;border:1px solid #555;border-radius:14px;padding:20px}

.dialog h2{font-size:18px;margin:0 0 18px}

.dialog label{display:block;color:#ccc;font-size:13px;margin:13px 0 6px}

.dialog input{width:100%;padding:12px;background:#090909;border:1px solid #555;border-radius:8px;color:white}

.actions{display:flex;gap:8px;margin-top:18px}

.actions button{flex:1;padding:12px;border-radius:8px;border:1px solid #666;background:#292929;color:white}

.actions .primary{background:#e5c052;color:#111;border:0;font-weight:bold}

.danger{color:#ff9999!important}

@media(max-width:520px){

header{height:50px}

main{padding:10px}

.stat{padding:13px 5px}

.content{grid-template-columns:1fr;gap:10px}

.panel{padding:12px}

.result-buttons button{height:65px}

}

</style>

</head>

<body>

<header>

<button class="menu" onclick="toggleMenu()" aria-label="メニュー">☰</button>

<div class="brand">KUJI PROGRESS</div>

<button class="menu" onclick="openHistory()">履歴</button>

</header>

<div id="menuBox">

<button onclick="openSettings()">⚙️　くじの設定</button>

<button onclick="openHistory()">📋　全履歴を見る</button>

<button onclick="undoLast()">↩️　直前の結果を取り消す</button>

<button onclick="resetAll()">⟳　くじをリセット</button>

</div>

<main>

<section class="stats">

<div class="stat">

<small>残りの当たり</small>

<strong class="gold" id="wins">1</strong>

</div>

<div class="stat">

<small>残りのくじ</small>

<strong id="tickets">10</strong>

</div>

</section>

<section class="prob">

<small>現在の当選確率</small>

<strong id="probability">10.00%</strong>

</section>

<section class="content">

<div class="panel">

<h2>結果を記録</h2>

<div class="result-buttons">

<button class="win" onclick="record('当たり')">当たり</button>

<button class="lose" onclick="record('ナイチャレ')">ナイチャレ</button>

</div>

<p class="hint">結果を押すと残り枚数を自動更新</p>

</div>

<div class="panel">

<h2>直近の結果（5件）</h2>

<div id="recent"></div>

</div>

</section>

</main>

<div class="overlay" id="settingsOverlay">

<div class="dialog">

<h2>くじの設定</h2>

<label for="totalInput">くじの総数</label>

<input id="totalInput" type="number" min="1" max="100000" inputmode="numeric">

<label for="winInput">当たりの数</label>

<input id="winInput" type="number" min="0" max="100000" inputmode="numeric">

<div class="actions">

<button onclick="closeDialogs()">キャンセル</button>

<button class="primary" onclick="saveSettings()">設定を保存</button>

</div>

</div>

</div>

<div class="overlay" id="historyOverlay">

<div class="dialog">

<h2>くじの履歴</h2>

<div id="allHistory"></div>

<div class="actions">

<button class="primary" onclick="closeDialogs()">閉じる</button>

</div>

</div>

</div>

<script>

const KEY="kujiProgressApp_v1";

function fresh(total=10,wins=1){

return {

total:total,

totalWins:wins,

remaining:total,

remainingWins:wins,

history:[]

};

}

function loadState(){

try{

const raw=localStorage.getItem(KEY);

if(raw){

const s=JSON.parse(raw);

if(Number.isInteger(s.total)&&Number.isInteger(s.remaining)&&

Number.isInteger(s.remainingWins)&&Array.isArray(s.history)){

return s;

}

}

}catch(e){}

return fresh();

}

let state=loadState();

function persist(){

try{

localStorage.setItem(KEY,JSON.stringify(state));

}catch(e){

alert("端末への保存に失敗しました。");

}

}

function escapeHtml(value){

return String(value).replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#39;"

}[c];

});

}

function render(){

document.getElementById("wins").textContent=state.remainingWins;

document.getElementById("tickets").textContent=state.remaining;

const probability=state.remaining>0

?state.remainingWins/state.remaining*100

:0;

document.getElementById("probability").textContent=

probability.toFixed(2)+"%";

const recent=state.history.slice(-5).reverse();

document.getElementById("recent").innerHTML=

recent.length

?recent.map(function(item){

return '<div class="history-row"><span>'+

escapeHtml(item.time)+'</span><span class="badge '+

(item.result==="当たり"?"badge-win":"badge-lose")+'">'+

escapeHtml(item.result)+'</span></div>';

}).join("")

:'<div class="empty">まだ結果はありません</div>';

}

function record(result){

if(state.remaining<=0){

alert("くじが残っていません。設定から新しいくじを開始してください。");

return;

}

if(result==="当たり"&&state.remainingWins<=0){

alert("当たりは残っていません。");

return;

}

state.remaining--;

if(result==="当たり"){

state.remainingWins--;

}

const now=new Date();

state.history.push({

result:result,

time:now.toLocaleTimeString("ja-JP",{

hour:"2-digit",

minute:"2-digit",

second:"2-digit"

})

});

persist();

render();

}

function toggleMenu(){

const menu=document.getElementById("menuBox");

menu.style.display=menu.style.display==="block"?"none":"block";

}

function hideMenu(){

document.getElementById("menuBox").style.display="none";

}

function openSettings(){

hideMenu();

document.getElementById("totalInput").value=state.total;

document.getElementById("winInput").value=state.totalWins;

document.getElementById("settingsOverlay").style.display="flex";

}

function openHistory(){

hideMenu();

const history=state.history.slice().reverse();

document.getElementById("allHistory").innerHTML=

history.length

?history.map(function(item,index){

return '<div class="history-row"><span>'+

(history.length-index)+'. '+

escapeHtml(item.time)+'</span><span class="badge '+

(item.result==="当たり"?"badge-win":"badge-lose")+'">'+

escapeHtml(item.result)+'</span></div>';

}).join("")

:'<div class="empty">履歴はありません</div>';

document.getElementById("historyOverlay").style.display="flex";

}

function closeDialogs(){

document.querySelectorAll(".overlay").forEach(function(el){

el.style.display="none";

});

}

function saveSettings(){

const total=Number(document.getElementById("totalInput").value);

const wins=Number(document.getElementById("winInput").value);

if(!Number.isInteger(total)||total<1||total>100000){

alert("くじの総数は1〜100000で入力してください。");

return;

}

if(!Number.isInteger(wins)||wins<0||wins>total){

alert("当たりの数は0〜くじの総数で入力してください。");

return;

}

if(!confirm("設定を変更すると、現在のくじと履歴がリセットされます。よろしいですか？")){

return;

}

state=fresh(total,wins);

persist();

render();

closeDialogs();

}

function undoLast(){

hideMenu();

if(state.history.length===0){

alert("取り消せる履歴がありません。");

return;

}

if(!confirm("直前の結果を取り消しますか？")){

return;

}

const last=state.history.pop();

state.remaining++;

if(last.result==="当たり"){

state.remainingWins++;

}

persist();

render();

}

function resetAll(){

hideMenu();

if(!confirm("くじと履歴を初期状態に戻しますか？")){

return;

}

state=fresh(state.total,state.totalWins);

persist();

render();

closeDialogs();

}

document.querySelectorAll(".overlay").forEach(function(el){

el.addEventListener("click",function(event){

if(event.target===el){

closeDialogs();

}

});

});

document.addEventListener("click",function(event){

const menu=document.getElementById("menuBox");

if(menu.style.display==="block"&&

!menu.contains(event.target)&&

!event.target.closest(".menu")){
